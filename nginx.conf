# ==============================================================
# FinLedger Production Nginx Configuration
# Reverse-Proxy, TLS Termination, OWASP Hardening & SPA Routing
# ==============================================================

# Compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    image/svg+xml;

# Upstream Backend Spring Boot API Container
upstream backend_api {
    server api:8080;
    keepalive 32;
}

# --------------------------------------------------
# Port 80: HTTP Redirect to HTTPS & ACME challenge
# --------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow Let's Encrypt / ACME challenge if needed
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS (Port 443)
    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------
# Port 443: HTTPS, TLS Termination & Reverse-Proxy
# --------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # SSL / TLS Settings
    ssl_certificate /etc/nginx/certs/finledger.crt;
    ssl_certificate_key /etc/nginx/certs/finledger.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OWASP Top 10 Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Root Directory for Angular Production Build
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-Proxy /api/* to Spring Boot finledger-api container
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Timeouts for long-running reports and exports
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disable buffering for streaming responses (PDF/Excel exports)
        proxy_buffering off;
        client_max_body_size 25M;
    }

    # Reverse-Proxy /actuator/health for load balancer health probes
    location /actuator/health {
        proxy_pass http://backend_api/actuator/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Static Assets Caching (Fingerprinted/hashed files)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Angular SPA HTML5 Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

